# Development services. Started with `make up`.
# The API, the agent and the web app run directly on the machine (`make dev`).
name: zynthera

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 keeps its data in a versioned folder under this path.
      - pgdata:/var/lib/postgresql
      # Creates the zynthera_test database on first start.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.8.4-alpine
    # Append-only persistence, so queued jobs survive a restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:6.3.0
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # A real XFCE desktop for the viewer to connect to in mock mode.
  dev-desktop:
    profiles: ["mock"]
    build: ./dev-desktop
    ports:
      - "127.0.0.1:5901:5901"

volumes:
  pgdata:
  redisdata:
